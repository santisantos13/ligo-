<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ligo!</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/hero.css">
</head>

<body>
  <header>

    <nav class="container">
      <a href="index.html">
        <img src="images/ligo-final/png/logo-principal-fundo-escuro.png" alt="Ligo! - Página inicial" class="logo">
      </a>

      <button class="menu-botao" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="menu" id="menu">

        <ul class="links">

          <li><a href="index.html" class="ativo" aria-current="page">Início</a></li>

          <li>

            <div class="select-container">
              <select name="categoria" id="categoria" aria-label="Escolha uma categoria">
                <option value="">Categorias</option>
                <option value="editor-video">Editor de vídeos</option>
                <option value="designer">Designer</option>
              </select>

              <svg class="select-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>

          </li>


          <li><a href="info.html">Como funciona</a></li>
          <li><a href="sobre.html">Sobre</a></li>
        </ul>

        <div class="login-cadastro">
          <a href="login.html" class="botao botao-contorno">Entrar</a>
          <a href="cadastro.html" class="botao botao-preenchido">Cadastrar</a>
        </div>

      </div>

    </nav>
  </header>

  <main class="container">
    <div class="texto">
      <h1>
        <span class="linha-1">Pessoas certas.</span>
        <span class="linha-2"><span class="destaque">Conexões</span> reais.</span>
      </h1>

      <p>Encontre profissionais e transforme suas ideias em realidade.</p>
    </div>

    <form class="busca" action="#" method="get">

      <div class="busca-campo busca-servico">
        <svg class="busca-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" name="servico" placeholder="O que você precisa?" aria-label="Qual serviço você procura">
      </div>

      <div class="busca-campo busca-cidade">
        <svg class="busca-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <select name="cidade" aria-label="Escolha sua cidade">
          <option value="">Sua cidade</option>
          <option value="belo-horizonte">Belo Horizonte</option>
          <option value="contagem">Contagem</option>
          <option value="betim">Betim</option>
        </select>
      </div>

      <button type="submit" class="busca-botao">Buscar</button>

    </form>



  </main>
  <script src="js/script.js"></script>

</body>

</html>
