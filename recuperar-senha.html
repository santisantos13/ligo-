<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha - Ligo!</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/header.css">
  <link rel="stylesheet" href="static/css/autenticacao.css">
  <link rel="stylesheet" href="static/css/fundos.css">
  <link rel="stylesheet" href="static/css/animacoes.css">
</head>

<body class="fundo-baixo">
  <header>

    <nav class="container">
      <a href="index.html">
        <img src="static/images/ligo-final/png/logo-principal-fundo-escuro.png"
          alt="Ligo! - Página inicial" class="logo">
      </a>

      <button class="menu-botao" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="menu" id="menu">

        <ul class="links">

          <li><a href="index.html">Início</a></li>

          <li><a href="info.html">Como funciona</a></li>
          <li><a href="sobre.html">Sobre</a></li>
        </ul>

        <div class="login-cadastro">
          <a href="login.html" class="botao botao-contorno">Entrar</a>
          <a href="cadastro.html" class="botao botao-preenchido">Cadastrar</a>
        </div>

      </div>

    </nav>
  </header>

  <main class="container">
    <div class="auth">

      <section class="auth-apresentacao">
        <div class="auth-texto">
          <h1>Recuperar <span class="destaque">senha</span></h1>
          <p>Informe o e-mail da sua conta e enviaremos as instruções para criar uma nova senha.</p>
        </div>
      </section>

      <section class="auth-cartao">
        <h2>Esqueceu sua senha?</h2>
        <p class="descricao">Digite o e-mail usado no cadastro</p>

        <form class="formulario" id="formulario-recuperacao" method="post" novalidate>
          <p class="formulario-erro" id="recuperacao-erro" role="alert" hidden></p>

          <label for="email">E-mail</label>
          <input type="email" name="email" id="email" placeholder="Digite seu e-mail..." autocomplete="email" required>

          <button type="submit">Enviar instruções</button>
        </form>

        <p class="auth-troca">Lembrou a senha? <a href="login.html">Entrar</a></p>
      </section>

    </div>
  </main>

  <footer>
    <p>&copy; 2026 Ligo LTDA - Todos os direitos reservados</p>
  </footer>

  <script src="static/js/script.js"></script>
  <script src="static/js/autenticacao.js"></script>

</body>

</html>
